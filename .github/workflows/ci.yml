name: ci

# The per-commit checks-and-tests gate, consolidated from the previous
# backend.yml + frontend.yml + docs-pairing.yml trio. One workflow, one
# place to read what a commit must pass.
#
# Deliberately NO path filters: every push to main and every PR runs
# every job. Two reasons over the previous per-area `paths:` filters:
# - Required status checks that get path-skipped never report, which
#   blocks the merge button forever on (e.g.) a docs-only PR once
#   branch protection is on. Always-run jobs always report.
# - The suites are small (backend ~1 min with the service container,
#   frontend <1 min) — the simplicity is worth more than the minutes.
#
# pr-title.yml stays a separate workflow on purpose: it triggers on
# `edited` (title changes) and merging it here would re-run the full
# test suite on every title edit.
#
# Least-privilege: jobs only read source + run tests. No PR comments,
# no pushes, no artefact publication. ``contents: read`` is the
# minimum for checkout.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # Default types + `labeled`/`unlabeled` so the docs-pairing
    # `no-docs-needed` exemption (below) takes effect the moment the
    # label is toggled, with no extra push. Re-running the suite on a
    # label change is the same simplicity-over-minutes trade as the
    # no-path-filters choice above; label toggles are rare.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# A force-push to a PR branch obsoletes the in-flight run — cancel it.
# Pushes to main always run to completion so the post-merge signal on
# every merged commit stays intact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: vulture
        run: uv run vulture

  # The suite runs as three shards, each on its own runner with its own
  # Postgres, so the pytest step costs about a third of a single job's.
  # pytest-split assigns each test to a shard from the per-test durations in
  # backend/.test_durations, which keeps the shards within seconds of each
  # other. A test missing from that file counts as the average duration, so a
  # new test never breaks the split, only shifts the balance;
  # docs/engineering.md has the refresh command. Inside a shard, worksteal
  # spreads the slow test_rate_limits.py cases over all four workers, where
  # loadfile would pin the whole file to one.
  #
  # Runs in parallel with the lint job (no `needs:`), the norm on public
  # repos where runner minutes are free: one cycle surfaces lint AND test
  # failures together. `fail-fast: false` follows the same rule: a red shard
  # does not cancel the others, so every failing test reports in one cycle.
  backend-test-shard:
    name: Backend test shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vision
          POSTGRES_USER: vision
          POSTGRES_PASSWORD: vision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vision:vision@localhost:5432/vision
      JWT_SECRET: test-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # No separate `alembic upgrade head` step: the parallel run builds a
      # template database at alembic head (tests/conftest.py) and clones it
      # per worker, so the migrations run as part of the pytest step.
      - name: pytest
        run: >-
          uv run pytest -v -n 4 --dist worksteal
          --splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  # `Backend tests` is a required status check on main, and a matrix job
  # reports one check per shard under another name. This job carries the
  # required name: `if: always()` makes it report even when a shard fails
  # or is cancelled, and it fails unless every shard succeeded.
  backend-test:
    name: Backend tests
    needs: backend-test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.backend-test-shard.result }}
        run: |
          echo "Backend test shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success

  # The frontend checks run as three parallel jobs, each with its own `npm ci`,
  # and the `frontend` job below reports their combined result. One job running
  # the four steps in sequence took about twice as long.
  frontend-lint:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Turbopack keeps its build cache under `.next/cache`, and a warm cache
      # cuts `next build` to about a third. The key changes with any source
      # change, so every run saves a fresh cache; the prefix in restore-keys
      # restores the closest earlier one, and Turbopack rebuilds only the
      # modules that changed since.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/*.mjs', 'frontend/*.ts', 'frontend/tsconfig.json') }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # Sentinel value: api.ts hard-fails if unset, but CI doesn't deploy
          # the bundle so the URL just needs to exist, not work. Real deploys
          # set the production URL in their build environment.
          NEXT_PUBLIC_API_URL: https://api.invalid

  # Branch protection requires this check name. `always()` makes it report
  # when a part fails or is cancelled, and it passes only when all three did.
  frontend:
    name: Frontend lint, type-check, test, build
    needs: [frontend-lint, frontend-test, frontend-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A frontend job ended as $result."
              exit 1
            fi
          done

  # The narrow-viewport smoke suite: the four golden paths (a shared event
  # link, the map, the submit form in both of its single-event modes, sign-in
  # and settings) plus the request board, measured at 375x812 and 320x568 for
  # sideways scroll, a primary control pushed out of the column, and field text
  # under 16px.
  #
  # Its own job rather than a step on `frontend`: it downloads a browser and
  # runs a Next server, and a phone-layout regression reports as its own red
  # check instead of hiding behind whichever step failed first above.
  #
  # No backend and no database. `frontend/e2e/support/mockApi.ts` answers every
  # API call in the browser, and `playwright.config.ts` hands the web server the
  # fake API origin those route patterns are written against.
  frontend-e2e:
    name: Frontend narrow-viewport smoke tests
    runs-on: ubuntu-latest
    # The suite builds the app, serves it and drives a browser, so a hang
    # here costs a runner rather than failing: the whole job is well under 5
    # minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The browser download is the slowest step in the job, and the version it
      # downloads is decided by @playwright/test, so the lock file's resolved
      # version is the cache key: a Dependabot bump misses the cache and
      # re-downloads, and nothing else does.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # The browser's shared libraries and fonts are apt packages outside the
      # cached directory, so they install on every run, cache hit or not.
      # `install-deps` needs only the `playwright` package, so it runs beside
      # `npm ci` instead of after it.
      - name: Install dependencies and the browser's system packages
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
        run: |
          npx --yes "playwright@$PLAYWRIGHT_VERSION" install-deps chromium &
          deps=$!
          npm ci
          wait "$deps"

      - name: Cache the browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install chromium

      # The same Turbopack cache as `frontend-build`, under its own key: this
      # build bakes in the fake API origin from `e2e/support/environment.ts`,
      # and `next.config.mjs` adds an image pattern when that origin is local.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/*.mjs', 'frontend/*.ts', 'frontend/tsconfig.json') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Narrow-viewport smoke tests
        run: npm run test:e2e

      # The traces `playwright.config.ts` keeps on a failing run. Uploaded only
      # when the suite goes red, so a green run publishes nothing.
      - name: Upload the failing run's traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The frontend's enum types (lib/api-types.ts) are GENERATED from the backend
  # OpenAPI spec, not hand-maintained — so a backend schema change that isn't
  # regenerated would drift the committed types silently. This job regenerates
  # them (same `make gen-api-types` chain a contributor runs) and fails if the
  # result differs from what's committed. Needs both toolchains: uv + Python to
  # dump the spec (like backend-lint), Node + npm to run openapi-typescript
  # (like frontend).
  api-types:
    name: API types in sync with OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --all-extras --frozen
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate API types from the OpenAPI spec
        run: make gen-api-types

      - name: Fail if the committed types drifted from the spec
        run: git diff --exit-code frontend/src/lib/api-types.ts

  # The audit-hygiene gates. jscpd caps total duplication at 1% — the current
  # tree is ~0.5%, so it fails when a contributor adds a meaningful chunk of
  # copy-paste (it's a ceiling, not a zero-new-clones ratchet). knip refuses
  # dead frontend code (unused files / exports). Both pass the current tree
  # (see `.jscpd.json` / `frontend/knip.json`).
  hygiene:
    name: Hygiene — duplication & dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Duplication (jscpd)
        run: npx --yes jscpd@4.2.5 backend/app frontend/src

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Dead code (knip)
        run: npm run knip
        working-directory: frontend

      - name: Palette coverage
        run: npm run palette:check
        working-directory: frontend

      - name: Changelog line length
        run: awk 'length($0) > 300 { print "::error file=CHANGELOG.md,line=" NR "::Line is " length($0) " characters; keep a CHANGELOG entry to one line of at most 300"; bad=1 } END { exit bad }' CHANGELOG.md

  # Lightweight, opinionated guardrail: every PR to `main` must touch
  # at least one file under `docs/`, the reference surface (api /
  # data-model / engineering / design / backups / ingestion). If a change
  # is doc-worthy at all, *something* under here usually moves. The
  # intent is friction, not granular pairing rules.
  #
  # If the rule fires for a PR that has no docs impact, justify it in
  # the PR description and apply the `no-docs-needed` label: the job
  # then passes (same mechanism as the Dependabot exemption).
  #
  # Exempt from the rule: Dependabot PRs and any PR carrying the
  # `no-docs-needed` label. Routine version-bump PRs (security or
  # version-update) carry no reference-doc impact, and every Dependabot
  # bump that would gets its own human-authored CHANGELOG entry on merge.
  docs-pairing:
    name: PR touches docs/
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Note Dependabot exemption
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "✓ Dependabot PR: docs-pairing check is exempt for routine version bumps."
          echo "If this PR turns out to need a docs note (e.g., a breaking-change migration), the human handling the merge adds it via a follow-up commit on the branch."

      - name: Note no-docs-needed exemption
        if: contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          echo "✓ PR labelled 'no-docs-needed': docs-pairing check is exempt."
          echo "The author asserts this change has no docs/ impact (justify it in the PR description). Remove the label to re-enforce the check."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        with:
          fetch-depth: 0

      - name: Enumerate changed files
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          git diff --name-only "$MERGE_BASE..$HEAD" > /tmp/changed.txt
          echo "Changed files in this PR:"
          cat /tmp/changed.txt

      - name: Check docs/ touched
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          set -e
          if ! grep -qE '^docs/' /tmp/changed.txt; then
            echo "::error::No file under docs/ was touched. Every PR should update reference docs (api / data-model / engineering / design / backups / ingestion) when production behavior, API surface, schema, or operational config changes. If the PR has no docs/ impact, justify it in the description and apply the 'no-docs-needed' label."
            exit 1
          fi

          echo "✓ docs/ touched."
