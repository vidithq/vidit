name: ci

# The per-commit checks-and-tests gate, consolidated from the previous
# backend.yml + frontend.yml + docs-pairing.yml trio. One workflow, one
# place to read what a commit must pass.
#
# Deliberately NO path filters: every push to main and every PR runs
# every job. Two reasons over the previous per-area `paths:` filters:
# - Required status checks that get path-skipped never report, which
#   blocks the merge button forever on (e.g.) a docs-only PR once
#   branch protection is on. Always-run jobs always report.
# - The suites are small (backend ~1 min with the service container,
#   frontend <1 min) — the simplicity is worth more than the minutes.
#
# pr-title.yml stays a separate workflow on purpose: it triggers on
# `edited` (title changes) and merging it here would re-run the full
# test suite on every title edit.
#
# Least-privilege: jobs only read source + run tests. No PR comments,
# no pushes, no artefact publication. ``contents: read`` is the
# minimum for checkout.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # Default types + `labeled`/`unlabeled` so the docs-pairing
    # `no-docs-needed` exemption (below) takes effect the moment the
    # label is toggled, with no extra push. Re-running the suite on a
    # label change is the same simplicity-over-minutes trade as the
    # no-path-filters choice above; label toggles are rare.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# A force-push to a PR branch obsoletes the in-flight run — cancel it.
# Pushes to main always run to completion so the post-merge signal on
# every merged commit stays intact.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: vulture
        run: uv run vulture

  backend-test:
    name: Backend tests
    # Runs in parallel with the lint job (no `needs:`), the norm on public
    # repos where runner minutes are free: one cycle surfaces lint AND test
    # failures together, and a green run (the common case) doesn't pay the
    # lint duration up front. The old lint gate earned its keep when the
    # serial suite cost several minutes; at ~1.5 min parallelized it only
    # added latency.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vision
          POSTGRES_USER: vision
          POSTGRES_PASSWORD: vision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vision:vision@localhost:5432/vision
      JWT_SECRET: test-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # No separate `alembic upgrade head` step: the parallel run builds a
      # template database at alembic head (tests/conftest.py) and clones it
      # per worker, so the migrations run as part of the pytest step.
      - name: pytest
        run: uv run pytest -v -n 4 --dist loadfile

  # Deliberately ONE job, not a checks job gating a test job: the steps
  # already run in fail-fast order (eslint → tsc → vitest → next build)
  # off a single `npm ci`, so a lint failure stops everything after it.
  # Splitting would buy nothing and pay a second dependency install.
  frontend:
    name: Frontend lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Sentinel value: api.ts hard-fails if unset, but CI doesn't deploy
          # the bundle so the URL just needs to exist, not work. Real deploys
          # get the production URL from Vercel project settings.
          NEXT_PUBLIC_API_URL: https://api.invalid

  # The frontend's enum types (lib/api-types.ts) are GENERATED from the backend
  # OpenAPI spec, not hand-maintained — so a backend schema change that isn't
  # regenerated would drift the committed types silently. This job regenerates
  # them (same `make gen-api-types` chain a contributor runs) and fails if the
  # result differs from what's committed. Needs both toolchains: uv + Python to
  # dump the spec (like backend-lint), Node + npm to run openapi-typescript
  # (like frontend).
  api-types:
    name: API types in sync with OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --all-extras --frozen
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate API types from the OpenAPI spec
        run: make gen-api-types

      - name: Fail if the committed types drifted from the spec
        run: git diff --exit-code frontend/src/lib/api-types.ts

  # The audit-hygiene gates. jscpd caps total duplication at 1% — the current
  # tree is ~0.5%, so it fails when a contributor adds a meaningful chunk of
  # copy-paste (it's a ceiling, not a zero-new-clones ratchet). knip refuses
  # dead frontend code (unused files / exports). Both pass the current tree
  # (see `.jscpd.json` / `frontend/knip.json`).
  hygiene:
    name: Hygiene — duplication & dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Duplication (jscpd)
        run: npx --yes jscpd@4.2.5 backend/app frontend/src

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Dead code (knip)
        run: npm run knip
        working-directory: frontend

      - name: Palette coverage
        run: npm run palette:check
        working-directory: frontend

  # Lightweight, opinionated guardrail: every PR to `main` must touch
  # at least one file under `docs/` AND at least one file under
  # `planning/`. The intent is friction, not granular pairing rules:
  #
  # - `docs/` is the reference surface (api / data-model / engineering /
  #   design / backups). If a change is doc-worthy at all, *something*
  #   under here usually moves.
  # - `planning/` is the in-flight tracker (`next.md` + `roadmap.md`).
  #   A shipped change should remove or amend a tracker row; a non-
  #   shipped change (refactor, bugfix never on the tracker) is rare
  #   enough that touching `planning/next.md` with a brief note in the
  #   relevant macro is reasonable overhead.
  #
  # If the rule fires legitimately for a PR that genuinely doesn't need
  # either touch, justify it in the PR description and apply the
  # `no-docs-needed` label — the job then passes (same mechanism as the
  # Dependabot exemption). The rule is a friction-first guardrail, not a
  # hard contract.
  #
  # Exempt from the rule: Dependabot PRs and any PR carrying the
  # `no-docs-needed` label. Routine version-bump PRs (security or
  # version-update) don't carry reference-doc or tracker impact — every
  # Dependabot bump that would, gets its own human-authored CHANGELOG
  # entry on merge anyway. Forcing a doc/+planning/ touch on each weekly
  # Dependabot wave is friction without signal.
  docs-pairing:
    name: PR touches docs/ and planning/
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Note Dependabot exemption
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "✓ Dependabot PR — docs-pairing check is exempt for routine version bumps."
          echo "If this PR turns out to need a doc / planning note (e.g., a breaking-change migration), the human handling the merge adds it via a follow-up commit on the branch."

      - name: Note no-docs-needed exemption
        if: contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          echo "✓ PR labelled 'no-docs-needed' — docs-pairing check is exempt."
          echo "The author asserts this change has no docs/ + planning/ impact (justify it in the PR description). Remove the label to re-enforce the check."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        with:
          fetch-depth: 0

      - name: Enumerate changed files
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          git diff --name-only "$MERGE_BASE..$HEAD" > /tmp/changed.txt
          echo "Changed files in this PR:"
          cat /tmp/changed.txt

      - name: Check docs/ + planning/ touched
        if: github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
        run: |
          set -e
          FILES=$(cat /tmp/changed.txt)
          touched() { echo "$FILES" | grep -qE "$1"; }
          FAIL=0

          if ! touched '^docs/'; then
            echo "::error::No file under docs/ was touched. Every PR should update reference docs (api / data-model / engineering / design / backups) when production behavior, API surface, schema, or operational config changes. If the PR genuinely has no docs/ impact, justify it in the description and apply the 'no-docs-needed' label."
            FAIL=1
          fi

          if ! touched '^planning/'; then
            echo "::error::No file under planning/ was touched. Every PR should update the tracker — remove or amend a row in planning/next.md for shipped work, or leave a brief note in the relevant version for changes that weren't tracked. If the PR genuinely has no planning impact, justify it in the description and apply the 'no-docs-needed' label."
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "::error::docs-pairing check failed."
            exit 1
          fi

          echo "✓ docs/ and planning/ both touched."

  # Identity gate: `main` only ever carries commits from the allowlisted
  # identities. A commit authored under an unrelated address attributes
  # the work to whichever GitHub account owns that address, permanently
  # and publicly, and the fix once it is on `main` is a history rewrite.
  # Catching it on the PR costs one rebase instead.
  #
  # Checked for every commit in the PR range: the author email, the
  # committer email (the GitHub web UI and merge queues set it
  # independently of the author), and every `Co-authored-by:` trailer,
  # which GitHub resolves to an account exactly like the author field.
  # Co-authors are allowed a wider set: any GitHub noreply address and
  # any Anthropic address, so pair work and agent attribution need no
  # allowlist edit per contributor.
  #
  # PR-only, like `docs-pairing`: the range logic needs a base and a head
  # sha, and by the time a commit is on `main` the gate has already run.
  commit-authors:
    name: Commit author identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check author, committer and co-author emails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Allowed as author or committer of a commit reaching main.
          ALLOWED=$(cat <<'EOF'
          admin@vidit.app
          noreply@github.com
          49699333+dependabot[bot]@users.noreply.github.com
          EOF
          )

          allowed() { printf '%s\n' "$ALLOWED" | grep -Fxq -- "$1"; }

          # Co-authors additionally accept any GitHub noreply address and
          # any Anthropic address.
          coauthor_allowed() {
            if allowed "$1"; then return 0; fi
            case "$1" in
              *@users.noreply.github.com | *@anthropic.com) return 0 ;;
            esac
            return 1
          }

          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          FAIL=0

          for SHA in $(git rev-list "$MERGE_BASE..$HEAD_SHA"); do
            AUTHOR=$(git show -s --format='%ae' "$SHA")
            COMMITTER=$(git show -s --format='%ce' "$SHA")

            if ! allowed "$AUTHOR"; then
              echo "::error::$SHA: author email '$AUTHOR' is not an allowlisted identity."
              FAIL=1
            fi

            if ! allowed "$COMMITTER"; then
              echo "::error::$SHA: committer email '$COMMITTER' is not an allowlisted identity."
              FAIL=1
            fi

            TRAILERS=$(git show -s --format='%(trailers:key=Co-authored-by,valueonly)' "$SHA" \
              | sed -n 's/.*<\(.*\)>.*/\1/p')

            while IFS= read -r EMAIL; do
              [ -n "$EMAIL" ] || continue
              if ! coauthor_allowed "$EMAIL"; then
                echo "::error::$SHA: Co-authored-by email '$EMAIL' is not an allowed identity."
                FAIL=1
              fi
            done <<< "$TRAILERS"
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "::error::commit-authors check failed. Set the right identity (git config user.email), rewrite the offending commits (git rebase with --reset-author, or git commit --amend), and force-push the branch."
            exit 1
          fi

          echo "✓ Every commit in this PR carries an allowlisted identity."
