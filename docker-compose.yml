services:
  db:
    # The image production runs on Railway (see docs/engineering.md), so a
    # production dump restores locally without an extension or archive-format
    # mismatch. It ships postgis, postgis_topology, fuzzystrmatch, and
    # postgis_tiger_geocoder: the only extensions the dump references.
    image: postgis/postgis:16-3.4
    container_name: vidit-db
    environment:
      POSTGRES_DB: vision
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
